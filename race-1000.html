<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Игра</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;background:var(--bg);background-attachment:fixed;color:#fff;overflow-x:hidden;min-height:100vh;user-select:none;-webkit-user-select:none}
#deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.dec{position:absolute;opacity:.18;animation:drift linear infinite}
@keyframes drift{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-30px) rotate(12deg)}100%{transform:translateY(0) rotate(0)}}
section{display:none;position:relative;z-index:1;min-height:100vh;padding:74px 16px 30px;flex-direction:column;align-items:center;gap:16px}
section.active{display:flex}
.card{background:var(--card);border:2px solid rgba(255,255,255,.18);border-radius:28px;padding:22px;width:min(1050px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
h1{font-size:clamp(32px,5.6vw,66px);line-height:1.08;text-align:center;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px rgba(255,255,255,.25)}
h2{font-size:clamp(26px,3.8vw,42px);text-align:center}
.sub{font-size:clamp(18px,2.4vw,27px);line-height:1.35}
.story{font-size:clamp(19px,2.4vw,27px);line-height:1.45;background:rgba(0,0,0,.18);border-radius:20px;padding:14px 18px;margin-bottom:16px;text-align:left}
.hero{font-size:clamp(90px,15vw,170px);animation:heroA 2.6s ease-in-out infinite;display:inline-block;line-height:1}
@keyframes heroA{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-20px) rotate(6deg)}}
.btn{font-family:inherit;font-size:clamp(20px,2.6vw,30px);padding:14px 28px;border:none;border-radius:20px;background:linear-gradient(#ffe066,#ff9f1c);color:#3a1d00;font-weight:900;cursor:pointer;box-shadow:0 7px 0 #b45309;transition:transform .1s;margin:4px}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #b45309}
.btn.blue{background:linear-gradient(#bfdbfe,#3b82f6);color:#fff;box-shadow:0 7px 0 #1e3a8a}
.btn.green{background:linear-gradient(#86efac,#22c55e);color:#053b17;box-shadow:0 7px 0 #166534}
.btn:disabled{opacity:.4;cursor:default}
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);font-size:clamp(15px,2vw,22px);font-weight:800;gap:6px}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.16);border-radius:14px;padding:4px 10px;white-space:nowrap}
.pill.hot{background:#f97316;animation:pop .4s}
.ico{font-size:21px;background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:12px;padding:5px 9px;cursor:pointer}
input.name{font-family:inherit;font-size:clamp(22px,3vw,32px);padding:10px 16px;border-radius:16px;border:4px solid rgba(255,255,255,.6);text-align:center;width:min(480px,92%);font-weight:800;color:#1e1b4b;margin:6px 0 10px}
.avs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:6px 0 16px}
.av{font-size:48px;background:rgba(255,255,255,.12);border:4px solid transparent;border-radius:20px;padding:6px 10px;cursor:pointer;transition:transform .15s}
.av:hover{transform:scale(1.1)}
.av.sel{border-color:#fde047;background:rgba(253,224,71,.25);transform:scale(1.12)}
.botrow{display:flex;align-items:center;gap:14px;width:min(1050px,100%)}
.bot{font-size:clamp(50px,7vw,76px);animation:bob 2s ease-in-out infinite;flex:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bubble{background:#fff;color:#1e1b4b;border-radius:22px;padding:10px 16px;font-size:clamp(18px,2.3vw,27px);font-weight:800;position:relative;flex:1;text-align:left;min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.bubble:before{content:"";position:absolute;left:-14px;top:50%;margin-top:-12px;border:12px solid transparent;border-right-color:#fff;border-left:0}
.sayb{font-size:24px;border:none;background:#e0e7ff;border-radius:12px;padding:4px 8px;cursor:pointer;flex:none}
.q{font-size:clamp(23px,3.3vw,40px);font-weight:900;margin-bottom:10px;line-height:1.3}
.vis{margin:6px 0 14px}
.opts{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:6px}
.opt{font-family:inherit;min-width:110px;font-size:clamp(24px,3.6vw,44px);padding:12px 24px;border-radius:22px;background:#fff;color:#1e1b4b;border:4px solid #c7d2fe;font-weight:900;cursor:pointer;box-shadow:0 7px 0 #6366f1;transition:transform .1s}
.opt:hover{transform:translateY(-3px)}
.opt:active{transform:translateY(4px);box-shadow:0 3px 0 #6366f1}
.opt.word{font-size:clamp(19px,2.6vw,30px)}
.opt.ok{background:#4ade80;border-color:#15803d;color:#fff;box-shadow:0 7px 0 #15803d;animation:pop .45s}
.opt.bad{background:#fecaca;border-color:#ef4444;color:#7f1d1d;box-shadow:0 7px 0 #ef4444;animation:shake .45s;opacity:.75}
.opt.used{opacity:.25}
.opt:disabled{cursor:default}
.opt.yes{background:#dcfce7;border-color:#22c55e;box-shadow:0 7px 0 #15803d}
.opt.no{background:#fee2e2;border-color:#ef4444;box-shadow:0 7px 0 #b91c1c}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.fb{font-size:clamp(20px,2.6vw,30px);font-weight:800;min-height:34px;margin-top:12px;line-height:1.35}
.fb.good{color:#bbf7d0}.fb.badc{color:#fecaca}
.hintbtn{font-family:inherit;background:rgba(255,255,255,.14);color:#fff;border:2px solid rgba(255,255,255,.35);border-radius:14px;padding:8px 16px;font-size:18px;font-weight:800;cursor:pointer;margin:8px 4px 0}
.hintbox{font-size:clamp(18px,2.3vw,26px);font-weight:700;line-height:1.45;background:rgba(0,0,0,.2);border-radius:18px;padding:10px 14px;margin-top:8px;display:inline-block}
.nextrow{margin-top:12px}
#nextBtn{display:none}
.big{font-size:clamp(56px,10vw,120px);font-weight:900;letter-spacing:.06em;line-height:1.1}
.mid{font-size:clamp(38px,6vw,72px);font-weight:900;letter-spacing:.04em;line-height:1.2}
.chip{display:inline-block;padding:3px 12px;border-radius:12px;margin:3px;color:#fff;font-weight:900}
.hl{background:#fde047;color:#1e1b4b;border-radius:10px;padding:0 8px}
.box{display:inline-block;min-width:1.4em;border:4px dashed #fde047;border-radius:14px;color:#fde047;padding:0 8px}
.steps{display:inline-block;text-align:left;font-size:clamp(22px,3vw,36px);font-weight:900;line-height:1.5}
table.pt{border-collapse:separate;border-spacing:8px;margin:6px auto}
table.pt th{font-size:clamp(15px,2vw,22px);padding:6px 10px;border-radius:12px;color:#fff;min-width:84px}
table.pt td{background:#fff;color:#1e1b4b;font-size:clamp(40px,5.5vw,64px);font-weight:900;width:clamp(66px,9vw,100px);height:clamp(66px,9vw,100px);text-align:center;border-radius:14px}
table.pt td.hi{box-shadow:0 0 0 6px #fde047,0 0 30px #fde047}
/* ввод */
.inrow{font-size:clamp(34px,5.4vw,64px);font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.inbox{min-width:2.6em;min-height:1.25em;background:#fff;color:#1e1b4b;border-radius:18px;padding:0 14px;border:5px solid #fde047;box-shadow:0 0 24px rgba(253,224,71,.6);display:inline-block}
.inbox.bad{animation:shake .45s;border-color:#ef4444}
.inbox.ok{border-color:#22c55e;background:#dcfce7}
.keypad{display:grid;grid-template-columns:repeat(4,minmax(64px,96px));gap:10px;justify-content:center}
.key{font-family:inherit;font-size:clamp(28px,4vw,42px);font-weight:900;padding:8px 0;border-radius:18px;border:none;background:#fff;color:#1e1b4b;box-shadow:0 6px 0 #6366f1;cursor:pointer}
.key:active{transform:translateY(4px);box-shadow:0 2px 0 #6366f1}
.key.del{background:#fde68a;box-shadow:0 6px 0 #b45309}
.key.ok{background:#4ade80;color:#053b17;box-shadow:0 6px 0 #15803d}
/* порядок */
.slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.slot{min-width:100px;min-height:72px;border:4px dashed rgba(255,255,255,.5);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,3.4vw,40px);font-weight:900;padding:4px 12px}
.slot.full{border-style:solid;border-color:#4ade80;background:rgba(74,222,128,.25);animation:pop .35s}
/* карта */
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;width:min(1150px,100%)}
.node{background:var(--card);border:3px solid rgba(255,255,255,.2);border-radius:24px;padding:14px 10px;text-align:center;cursor:pointer;transition:transform .2s;position:relative}
.node:hover{transform:translateY(-6px) scale(1.03)}
.node.locked{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.node.locked:hover{transform:none}
.node.next{border-color:#fde047;box-shadow:0 0 30px rgba(253,224,71,.55)}
.ball{width:110px;height:110px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:52px;animation:bob 4s ease-in-out infinite}
.nname{font-size:21px;font-weight:900}
.ndesc{font-size:16px;opacity:.9;margin:4px 0}
.nstars{font-size:26px;letter-spacing:3px}
.nnum{position:absolute;top:8px;left:12px;background:#fde047;color:#1e1b4b;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:900}
.nav{position:absolute;top:-10px;right:4px;font-size:40px;animation:bob 1.5s infinite}
#collected{font-size:clamp(22px,3vw,34px);font-weight:900;text-align:center}
.gtitle{font-size:clamp(23px,3.2vw,38px);font-weight:900;text-align:center}
/* дорожка */
.track{position:relative;width:min(1050px,100%);height:46px;background:rgba(0,0,0,.25);border-radius:30px;border:2px solid rgba(255,255,255,.25)}
.tfill{position:absolute;left:0;top:0;bottom:0;border-radius:30px;background:linear-gradient(90deg,rgba(74,222,128,.5),rgba(74,222,128,.9));transition:width .6s}
.tav{position:absolute;top:-4px;font-size:40px;transition:left .6s;transform:translateX(-10%)}
.tgoal{position:absolute;right:6px;top:-2px;font-size:38px}
.tdot{position:absolute;top:19px;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5)}
/* босс */
.bossbar{display:flex;align-items:center;gap:12px;width:min(1050px,100%);background:rgba(0,0,0,.3);border-radius:20px;padding:6px 14px}
.bossE{font-size:56px;display:inline-block}
.bossE.hit{animation:hit .5s}
@keyframes hit{0%{transform:scale(1)}30%{transform:scale(.7) rotate(-15deg);filter:brightness(3)}100%{transform:scale(1)}}
.hp{flex:1;height:26px;background:rgba(255,255,255,.2);border-radius:14px;overflow:hidden}
.hpfill{height:100%;background:linear-gradient(90deg,#ef4444,#f97316);transition:width .5s}
/* награда */
.bigstars{font-size:clamp(70px,12vw,130px);letter-spacing:10px}
.bigstars span{display:inline-block;opacity:0;animation:starin .6s forwards}
@keyframes starin{0%{opacity:0;transform:scale(0) rotate(-180deg)}70%{transform:scale(1.4) rotate(20deg)}100%{opacity:1;transform:scale(1)}}
.prize{font-size:96px;animation:bob 2s infinite;display:inline-block}
/* теория */
.tstep{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.tstep span{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.25)}
.tstep span.cur{background:#fde047}
.tbody{font-size:clamp(20px,2.6vw,30px);line-height:1.5;margin:12px 0}
.rule{background:#fff8d6;color:#3b2a00;border-left:10px solid #f59e0b;border-radius:16px;padding:12px 18px;font-weight:800;text-align:left;margin:12px auto;max-width:860px;font-size:clamp(20px,2.6vw,30px)}
.rule b{color:#b45309}
.ex{background:rgba(0,0,0,.2);border-radius:18px;padding:10px 16px;display:inline-block;margin:6px;font-weight:900;font-size:clamp(19px,2.4vw,28px);line-height:1.45}
.grid2{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
/* метеоры / блиц */
.btop{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.tbar{flex:1;height:26px;background:rgba(255,255,255,.18);border-radius:20px;overflow:hidden}
.tbfill{height:100%;background:linear-gradient(90deg,#f87171,#fbbf24,#4ade80);width:100%;transition:width 1s linear}
.bscore{font-size:clamp(24px,3.4vw,38px);font-weight:900;min-width:100px}
.ttxt{font-size:clamp(22px,3vw,34px);font-weight:900;min-width:80px}
.arena{position:relative;min-height:clamp(200px,30vh,300px);border-radius:24px;background:rgba(0,0,0,.25);overflow:hidden;border:3px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;padding:14px}
.bcard{background:#fff;color:#1e1b4b;border-radius:26px;padding:20px 28px;font-size:clamp(26px,4vw,48px);font-weight:900;line-height:1.3;box-shadow:0 0 40px rgba(255,255,255,.4);max-width:92%}
.bcard.in{animation:cin .45s ease-out}
@keyframes cin{0%{transform:translateY(-140px) scale(.6);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
.bcard.boom{animation:boom .45s forwards}
@keyframes boom{100%{transform:scale(1.7);opacity:0;filter:blur(6px)}}
/* модалка, тост */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.mcard{background:#fff;color:#1e1b4b;border-radius:26px;padding:22px;max-width:900px;width:100%;text-align:center;max-height:90vh;overflow:auto}
.mcard .rule{margin:10px auto}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) scale(0);z-index:45;background:linear-gradient(#fde047,#f97316);color:#3a1d00;font-size:clamp(24px,3.4vw,40px);font-weight:900;padding:14px 30px;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.4);transition:transform .3s;pointer-events:none;text-align:center}
#toast.show{transform:translateX(-50%) scale(1)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.diploma{background:linear-gradient(135deg,#fff7d6,#ffe9a8);color:#3b2a00;border:10px double #b45309;border-radius:24px;padding:28px;width:min(900px,100%);text-align:center}
.diploma h1{color:#92400e;text-shadow:none}
.who{font-size:clamp(30px,5vw,54px);font-weight:900;color:#7c2d12;margin:12px 0;border-bottom:3px solid #b45309;display:inline-block;padding:0 20px}
svg text{font-family:"Trebuchet MS",Arial,sans-serif;font-weight:900}
@media print{body{background:#fff!important}.topbar,#deco,.noprint{display:none!important}section{padding:0}}
</style></head><body>
<script>
/* ===== общие помощники ===== */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const o=(v,label,cls)=>({v,label:label===undefined?v:label,cls});
const PCOL=['#f59e0b','#22c55e','#3b82f6','#a855f7']; // единицы, десятки, сотни, тысячи
const PNAME=['единицы','десятки','сотни','тысячи'];
const PGEN=['единиц','десятков','сотен','тысяч'];
const PSH=['ед.','дес.','сот.','тыс.'];
// число с раскраской разрядов (справа налево)
function cnum(n,cls='big',hi=-1){const s=String(n);return `<span class="${cls}">`+s.split('').map((c,i)=>{const p=s.length-1-i;return `<span style="color:${PCOL[p]};${p===hi?'background:#fde047;border-radius:12px;padding:0 6px;color:#1e1b4b':''}">${c}</span>`}).join('')+'</span>';}
// таблица разрядов: сотни, десятки, единицы
function ptable(n,hi=-1,cols=3){const s=String(n).padStart(cols,' ');let h='<table class="pt"><tr>';for(let i=0;i<cols;i++){const p=cols-1-i;h+=`<th style="background:${PCOL[p]}">${PNAME[p]}</th>`;}h+='</tr><tr>';for(let i=0;i<cols;i++){const p=cols-1-i;h+=`<td class="${p===hi?'hi':''}" style="color:${PCOL[p]}">${s[i].trim()}</td>`;}return h+'</tr></table>';}
// варианты ответа-числа: правильный + правдоподобные
function nOpts(ans,cands=[],k=3,min=0){const set=new Set([ans]);const out=[ans];
 for(const c of cands){if(out.length>k)break;if(c>=min&&!set.has(c)&&Number.isFinite(c)){set.add(c);out.push(c);}}
 const extra=shuffle([1,-1,10,-10,2,-2,100,-100,5,-5,20,-20]);
 for(const d of extra){if(out.length>k)break;const c=ans+d;if(c>=min&&!set.has(c)){set.add(c);out.push(c);}}
 return out.map(v=>o(v));}
function words(n){
 const U=['','один','два','три','четыре','пять','шесть','семь','восемь','девять'];
 const T=['десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать','семнадцать','восемнадцать','девятнадцать'];
 const D=['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'];
 const H=['','сто','двести','триста','четыреста','пятьсот','шестьсот','семьсот','восемьсот','девятьсот'];
 if(n===0)return 'ноль';if(n===1000)return 'тысяча';
 const a=Math.floor(n/100),b=Math.floor(n/10)%10,c=n%10;const r=[];
 if(a)r.push(H[a]);if(b===1)r.push(T[c]);else{if(b)r.push(D[b]);if(c)r.push(U[c]);}
 return r.join(' ');
}
const sgn=(a,b)=>a>b?'>':a<b?'<':'=';
const CMP_OPTS=[o('<','&lt;'),o('=','='),o('>','&gt;')];
const cmpLabel=s=>s==='<'?'&lt;':s==='>'?'&gt;':'=';

/* Игра 9. Сложение и вычитание в пределах 1000 без перехода через разряд (с. 54–70) */
const D9=n=>[Math.floor(n/100),Math.floor(n/10)%10,n%10];
// пара без перехода: plus — разряды в сумме ≤ 9; minus — разряды уменьшаемого ≥ вычитаемого
function noCarry(plus,shape){for(;;){const a=rnd(101,899);let b;
 if(shape==='h')b=rnd(1,8)*100;else if(shape==='u')b=rnd(1,9);else if(shape==='t')b=rnd(1,9)*10+(Math.random()<.5?0:0);else if(shape==='tu')b=rnd(11,99);else b=rnd(101,899);
 const A=D9(a),B=D9(b);if(plus){if(A[0]+B[0]<=9&&A[1]+B[1]<=9&&A[2]+B[2]<=9&&a+b<1000)return[a,b];}else{if(A[0]>=B[0]&&A[1]>=B[1]&&A[2]>=B[2]&&a>b)return[a,b];}}}
function steps9(a,b,plus){const B=D9(b);const s=plus?'+':'−';const parts=[B[0]*100,B[1]*10,B[2]].filter(x=>x);let cur=a,out=[];
 if(parts.length===1)return `${a} ${s} ${b}: меняется только разряд ${B[0]?'сотен':B[1]?'десятков':'единиц'}`;
 out.push(`${b} = ${parts.join(' + ')}`);for(const p of parts){const nx=plus?cur+p:cur-p;out.push(`${cur} ${s} ${p} = ${nx}`);cur=nx;}return out.join('<br>');}
function col(a,b,plus){const A=String(a).padStart(3,' '),B=String(b).padStart(3,' ');const c=k=>PCOL[2-k];

 $('#tTitle').innerHTML=T.title;$('#tBody').innerHTML=T.html;$('#tPrev').style.visibility=S.tIdx?'visible':'hidden';
 $('#tNext').innerHTML=S.tIdx===G.theory.length-1?'Я понял! К заданиям 🚀':'Дальше ▶';}
$('#tPrev').onclick=()=>{if(S.tIdx>0){S.tIdx--;sClick();renderTheory();}};
$('#tNext').onclick=()=>{sClick();try{speechSynthesis.cancel()}catch(e){}if(S.tIdx<G.theory.length-1){S.tIdx++;renderTheory();}else{S.theorySeen=true;save();renderMap();show('scMap');}};
$('#tSay').onclick=()=>{const T=G.theory[S.tIdx];say(T.say||(T.title+'. '+T.html));};

/* --- карта --- */
const unlocked=i=>S.unlockAll||(i===0?S.theorySeen:S.stars[i-1]>0);
function renderMap(){const m=$('#map');m.innerHTML='';
 const th=document.createElement('div');th.className='node';th.innerHTML=`<div class="nnum">0</div><div class="ball" style="background:radial-gradient(circle at 30% 28%,#ffffffaa,#f59e0b 40%,#00000088)">📖</div><div class="nname">Правило</div><div class="ndesc">Теория с примерами</div><div class="nstars">${S.theorySeen?'✅':'👉'}</div>`;th.onclick=()=>{sClick();openTheory();};m.appendChild(th);
 const nx=ST.findIndex((s,i)=>!S.stars[i]&&unlocked(i));
 ST.forEach((s,i)=>{const lk=!unlocked(i),el=document.createElement('div');const st=S.stars[i]||0;
  el.className='node'+(lk?' locked':'')+(i===nx?' next':'');
  el.innerHTML=`<div class="nnum">${i+1}</div>${i===nx?`<div class="nav">${S.avatar}</div>`:''}<div class="ball" style="background:radial-gradient(circle at 30% 28%,#ffffffaa,${s.color} 40%,#00000088);box-shadow:0 0 34px ${s.color}88;animation-delay:${i*.3}s">${lk?'🔒':s.emoji}</div><div class="nname">${s.name}</div><div class="ndesc">${s.desc}</div><div class="nstars">${'⭐'.repeat(st)}${'<span style="opacity:.25">⭐</span>'.repeat(3-st)}</div>`;
  el.onclick=()=>{if(lk){sBad();toast('Сначала пройди предыдущий этап!');return;}sClick();startStation(i);};m.appendChild(el);});
 const got=ST.filter((s,i)=>S.stars[i]).map(s=>s.prize).join(' ');
 $('#collected').innerHTML=`${G.collectName}: ${got||'<span style="opacity:.7">пока пусто — вперёд!</span>'}`;
 $('#mapBottom').innerHTML=ST.every((s,i)=>S.stars[i])?'<button class="btn" id="getDip">🏆 Получить диплом!</button>':'';
 const g=$('#getDip');if(g)g.onclick=showDiploma;
 $('#unlockBtn').textContent=S.unlockAll?'🔒 Для учителя: вернуть замки':'🔓 Для учителя: открыть все этапы';}
$('#unlockBtn').onclick=()=>{S.unlockAll=!S.unlockAll;save();renderMap();};

/* --- станция --- */
let cur=null,keyHandler=null;
function startStation(i){clearInterval(S.bTimer);S.p=i;S.idx=0;S.first=0;const s=ST[i];
 $('#gTitle').innerHTML=`${s.emoji} ${s.name}`;show('scGame');bot(s.tip);
 if(s.type==='blitz'){$('#track').style.display='none';$('#boss').innerHTML='';blitzIntro();}else{$('#track').style.display='';next();}}
function renderTrack(){const s=ST[S.p];const n=s.count;let h=`<div class="tfill" style="width:${S.idx/n*100}%"></div>`;for(let k=1;k<n;k++)h+=`<div class="tdot" style="left:calc(${k/n*100}% - 4px)"></div>`;h+=`<div class="tgoal">${s.prize}</div><div class="tav" style="left:calc(${S.idx/n*88}% )">${S.avatar}</div>`;$('#track').innerHTML=h;
 if(s.boss){$('#boss').innerHTML=`<div class="bossbar"><span class="bossE" id="bossE">${s.boss.emoji}</span><div style="flex:1"><b>${s.boss.name}</b><div class="hp"><div class="hpfill" style="width:${(1-S.idx/n)*100}%"></div></div></div></div>`;}else $('#boss').innerHTML='';}
function clearArea(){$('#nextBtn').style.display='none';$('#fb').innerHTML='';$('#fb').className='fb';$('#hintbox').innerHTML='';keyHandler=null;}
function next(){const s=ST[S.p];clearArea();renderTrack();
 if(S.idx>=s.count)return finishStation();
 if(S.idx>0)bot(pick(['Следующее задание!','Вперёд!','Ещё немного!','Смотри внимательно!',s.tip]));
 const t=s.gen(S.idx);cur=t;window.__cur=t;S.tryFirst=true;
 $('#q').innerHTML=t.q;$('#vis').innerHTML=t.vis||'';
 const ty=t.type||'choice';
 if(ty==='choice')renderChoice(t);else if(ty==='input')renderInput(t);else if(ty==='order')renderOrder(t);
 if(t.hint)$('#hintbox').innerHTML='<button class="hintbtn" id="hb">💡 Подсказка</button>';
 const hb=$('#hb');if(hb)hb.onclick=()=>{S.tryFirst=false;showHint(t);};}
function showHint(t){$('#hintbox').innerHTML='<div class="hintbox">💡 '+t.hint()+'</div>';}
function renderChoice(t){const op=$('#opts');op.innerHTML='';(t.noShuffle?t.options:shuffle(t.options)).forEach(x=>{const b=document.createElement('button');b.className='opt'+(x.cls?' '+x.cls:'')+(t.word?' word':'');b.innerHTML=x.label;b.dataset.v=String(x.v);b.onclick=()=>{if(String(x.v)===String(t.ans)){b.classList.add('ok');document.querySelectorAll('#opts .opt').forEach(y=>y.disabled=true);success(t);}else{b.classList.add('bad');b.disabled=true;fail(t);}};op.appendChild(b);});}
function renderInput(t){let val='';const keys=t.keys||['1','2','3','4','5','6','7','8','9','0'];const max=t.max||5;
 $('#opts').innerHTML=`<div style="width:100%"><div class="inrow">${t.pre||''}<span class="inbox" id="inbox">&nbsp;</span>${t.post||''}</div><div class="keypad" id="kp"></div></div>`;
 const kp=$('#kp');const upd=()=>{$('#inbox').innerHTML=val||'&nbsp;';};
 const press=k=>{if(!kp.isConnected||kp.dataset.done)return;if(k==='⌫'){val=val.slice(0,-1);}else if(k==='✔'){check();return;}else if(val.length<max){val+=k;}tone(700+val.length*60,.05,'square',0,.03);upd();};
 const check=()=>{if(!val)return;const ib=$('#inbox');if(val===String(t.ans)){kp.dataset.done=1;ib.classList.add('ok');success(t);}else{ib.classList.remove('bad');void ib.offsetWidth;ib.classList.add('bad');fail(t,val);val='';setTimeout(upd,450);}};
 keys.concat(['⌫','✔']).forEach(k=>{const b=document.createElement('button');b.className='key'+(k==='⌫'?' del':k==='✔'?' ok':'');b.textContent=k;b.onclick=()=>press(k);kp.appendChild(b);});
 keyHandler=e=>{let k=e.key;if(k==='Backspace')k='⌫';else if(k==='Enter')k='✔';else{k=k.toUpperCase();if(k==='Х')k='X';if(k==='Ш')k='I';if(k==='М')k='V';}if(keys.includes(k)||k==='⌫'||k==='✔'){e.preventDefault();press(k);}};}
document.addEventListener('keydown',e=>{if(keyHandler&&$('#scGame').classList.contains('active'))keyHandler(e);});
function renderOrder(t){let pos=0;const n=t.order.length;
 $('#opts').innerHTML=`<div style="width:100%"><div class="slots" id="slots">${t.order.map((x,i)=>`<div class="slot" id="sl${i}">${i+1}</div>`).join('')}</div><div class="opts" id="oitems"></div></div>`;
 const box=$('#oitems');shuffle(t.items).forEach(x=>{const b=document.createElement('button');b.className='opt';b.innerHTML=x.label;b.dataset.v=String(x.v);b.onclick=()=>{if(String(x.v)===String(t.order[pos])){const sl=$('#sl'+pos);sl.innerHTML=x.label;sl.classList.add('full');b.disabled=true;b.classList.add('used');pos++;sClick();if(pos===n)success(t);}else{b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),500);fail(t);}};box.appendChild(b);});}
function success(t){sGood();setTimeout(sCoin,250);const add=S.tryFirst?10:3;addCoins(add);
 if(S.tryFirst){S.first++;S.streak++;S.best=Math.max(S.best,S.streak);}else S.streak=0;top();
 bot(pick(PRAISE)+` +${add} ${G.coin}`);
 if([3,5,8,12,16,20].includes(S.streak)&&S.tryFirst){addCoins(S.streak*2);toast(`🔥 Серия ${S.streak}! Бонус +${S.streak*2} ${G.coin}`);}
 $('#fb').className='fb good';$('#fb').innerHTML='✅ '+(t.explain||'Верно!');$('#hintbox').innerHTML='';
 if(t.onOk)t.onOk();const be=$('#bossE');if(be){be.classList.remove('hit');void be.offsetWidth;be.classList.add('hit');const hf=document.querySelector('.hpfill');if(hf)hf.style.width=(1-(S.idx+1)/ST[S.p].count)*100+'%';}
 $('#nextBtn').style.display='inline-block';keyHandler=null;}
function fail(t){sBad();S.tryFirst=false;S.streak=0;top();bot(pick(OOPS));$('#fb').className='fb badc';$('#fb').innerHTML='Не так. Смотри подсказку 👇';if(t.hint)showHint(t);}
$('#nextBtn').onclick=()=>{sClick();S.idx++;next();};
$('#sayBtn').onclick=()=>say($('#botText').innerHTML+'. '+$('#q').innerHTML);

/* --- блиц --- */
function blitzIntro(){clearArea();const s=ST[S.p];$('#q').innerHTML=s.name+'!';
 $('#vis').innerHTML=`<div class="sub" style="line-height:1.6">${s.intro||''}<br>Нажимай <b style="color:#4ade80">ВЕРНО</b> или <b style="color:#f87171">НЕВЕРНО</b>.<br>Время: ${s.time||90} секунд.</div>`;
 $('#opts').innerHTML='<button class="btn" id="bgo">Поехали! 🚀</button>';$('#bgo').onclick=startBlitz;}
function startBlitz(){const s=ST[S.p];const T=s.time||90;S.bScore=0;S.bTime=T;S.bLock=false;sClick();$('#q').innerHTML='';
 $('#vis').innerHTML=`<div class="btop"><div class="ttxt">⏱ <span id="tt">${T}</span></div><div class="tbar"><div class="tbfill" id="tbf"></div></div><div class="bscore">${s.hitEmoji||'💥'} <span id="bs">0</span></div></div><div class="arena"><div class="bcard" id="bc"></div></div>`;
 $('#opts').innerHTML='<button class="opt yes" id="by">✅ Верно</button><button class="opt no" id="bn">❌ Неверно</button>';
 $('#by').onclick=()=>bAns(true);$('#bn').onclick=()=>bAns(false);
 keyHandler=e=>{if(e.key==='ArrowLeft')bAns(true);if(e.key==='ArrowRight')bAns(false);};
 newCard();clearInterval(S.bTimer);
 S.bTimer=setInterval(()=>{S.bTime--;const tt=$('#tt');if(!tt){clearInterval(S.bTimer);return;}tt.textContent=S.bTime;$('#tbf').style.width=(S.bTime/T*100)+'%';if(S.bTime<=10&&S.bTime>0)tone(1200,.05,'square',0,.03);if(S.bTime<=0)endBlitz();},1000);}
function newCard(){const c=ST[S.p].gen();S.bc=c;const e=$('#bc');e.innerHTML=c.text;e.className='bcard';void e.offsetWidth;e.classList.add('in');}
function bAns(v){if(S.bLock||S.bTime<=0)return;S.bLock=true;const e=$('#bc');
 if(v===S.bc.truth){S.bScore++;$('#bs').textContent=S.bScore;sGood();addCoins(5);S.streak++;top();e.classList.add('boom');bot(pick(PRAISE));$('#fb').innerHTML='';
  if([5,10,15].includes(S.bScore))toast(`🔥 ${S.bScore} подряд!`);setTimeout(()=>{S.bLock=false;if(S.bTime>0)newCard();},500);}
 else{sBad();S.streak=0;top();bot('Ой! Смотри, как правильно.');$('#fb').className='fb badc';$('#fb').innerHTML=S.bc.exp;setTimeout(()=>{S.bLock=false;$('#fb').innerHTML='';if(S.bTime>0)newCard();},2200);}}
function endBlitz(){clearInterval(S.bTimer);keyHandler=null;const s=ST[S.p];const th=s.stars||[12,7];const sc=S.bScore;showReward(sc>=th[0]?3:sc>=th[1]?2:1,`Правильных ответов: <b>${sc}</b>`);}

/* --- награда --- */
function finishStation(){const s=ST[S.p];const q=S.first/s.count;showReward(q>=.85?3:q>=.6?2:1,`С первой попытки: <b>${S.first}</b> из ${s.count}`+(s.boss?`<br>${s.boss.emoji} ${s.boss.name} побеждён!`:''));}
function showReward(st,extra){const s=ST[S.p];S.stars[S.p]=Math.max(S.stars[S.p]||0,st);addCoins(st*10);save();
 $('#rwTitle').innerHTML=`${s.emoji} ${s.name} — пройдено!`;
 $('#rwStars').innerHTML=[0,1,2].map(k=>`<span style="animation-delay:${k*.35}s;${k<st?'':'filter:grayscale(1);opacity:.3'}">⭐</span>`).join('');
 $('#rwPrize').textContent=s.prize;
 const msg=st===3?'Великолепно! Ни одной лишней ошибки!':st===2?'Хорошая работа! Можно ещё лучше!':'Ты справился! Пройди ещё раз, чтобы получить больше звёзд.';
 $('#rwText').innerHTML=`${extra}<br>${msg}<br>Ты получаешь: ${s.prize} и ${st*10} ${G.coin}!`;
 show('scReward');sWin();confetti();}
$('#rwAgain').onclick=()=>startStation(S.p);
$('#rwMap').onclick=()=>{renderMap();show('scMap');};

/* --- диплом --- */
function showDiploma(){const t=totalStars(),mx=ST.length*3,q=t/mx;
 $('#dpName').textContent=S.avatar+' '+(S.name||'Герой');$('#dpRank').textContent=q>=.85?G.ranks[0]:q>=.6?G.ranks[1]:G.ranks[2];
 $('#dpStars').textContent=`Звёзд: ${t} из ${mx} ⭐   ${G.coin} ${S.coins}   Лучшая серия: ${S.best} 🔥`;
 $('#dpDate').textContent=new Date().toLocaleDateString('ru-RU');show('scDiploma');sWin();confetti();setTimeout(confetti,1200);}
$('#dpMap').onclick=()=>{renderMap();show('scMap');};
$('#dpNew').onclick=()=>{if(confirm('Начать игру заново? Звёзды и монеты обнулятся.')){Object.assign(S,{stars:{},coins:0,best:0,streak:0,theorySeen:false,unlockAll:false});save();show('scStart');}};

/* --- кнопки сверху --- */
$('#mapBtn').onclick=()=>{clearInterval(S.bTimer);if(!S.theorySeen&&$('#scStart').classList.contains('active'))return;renderMap();show('scMap');};
$('#sndBtn').onclick=()=>{S.sound=!S.sound;$('#sndBtn').textContent=S.sound?'🔊':'🔇';};
$('#fsBtn').onclick=()=>{try{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}catch(e){}};
$('#ruleBtn').onclick=()=>{$('#mBody').innerHTML=G.rule;$('#modal').classList.add('show');};
$('#mClose').onclick=()=>$('#modal').classList.remove('show');

load();if(S.name)$('#nameInp').value=S.name;document.querySelectorAll('.av').forEach(x=>x.classList.toggle('sel',x.textContent===S.avatar));top();
window.__G={S,ST,G};
})();

</script></body></html>
